<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Côté Montagne — Saint-Lary">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap');
      .handwritten { font-family: 'Fraunces', Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <!-- Mountain "M" silhouette in white -->
  <g fill="white">
    <path d="M 180 380
             L 260 80
             L 340 80
             L 390 280
             L 450 80
             L 530 80
             L 600 380
             L 520 380
             L 480 180
             L 410 380
             L 340 380
             L 290 200
             L 240 380
             Z"/>
  </g>

  <!-- "Côté" top-left - italic with rotation -->
  <text x="80" y="180"
        class="handwritten"
        font-weight="600"
        font-size="100"
        fill="white"
        transform="rotate(-8 130 160)">Côté</text>

  <!-- "Montagne" bottom - italic -->
  <text x="140" y="430"
        class="handwritten"
        font-weight="600"
        font-size="100"
        fill="white">Montagne</text>

  <!-- "St Lary" top-right - smaller italic -->
  <text x="500" y="220"
        class="handwritten"
        font-weight="500"
        font-size="60"
        fill="white"
        transform="rotate(-5 560 210)">St Lary</text>
</svg>
